name: CI Pipeline

on:
  push:
  pull_request:

jobs:
  quality-security-test:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install Dependencies
      run: |
        pip install -r requirements.txt

    - name: Code Quality
      run: |
        flake8 .

    - name: Security Scan
      run: |
        bandit -r .

    - name: Unit Tests